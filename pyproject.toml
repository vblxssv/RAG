[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "torch>=2.4.0",
    "tqdm>=4.70.1",
    "transformers>=4.40.0,<5.0.0",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "fire.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-tqdm>=4.70.0.20260906",
]
